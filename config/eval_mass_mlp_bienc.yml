# Evaluate the mass-candidate MLP biencoder ensemble trained for the revision.

common:
  dataset_tsv: /data/home/mira/data/msuq/MassSpecGym.tsv
  helper_dir: /data/home/mira/data/msuq
  gt_path: /data/home/mira/data/msuq/ground_truth_bits_labels_test.pt

  architecture: mlp
  candidate_setting: mass
  label_mode: inchikey
  max_mz: 1005.0
  n_peaks: 128
  prec_mz_intensity: 1.1

  base_out_dir: /data/home/mira/selective-msms/outputs/mass_mlp_bienc/eval

  metric: cosine
  top_k_hits: [1, 5, 20]
  temperature: 0.003
  aggregations: [score, fingerprint, probability]

  fingerprint_measures:
    - bitwise_epistemic
    - bitwise_aleatoric
    - bitwise_total
    - retrieval_aleatoric
    - retrieval_epistemic
    - retrieval_total

  retrieval_measures:
    - bitwise_total
    - bitwise_epistemic
    - retrieval_epistemic
    - retrieval_aleatoric
    - retrieval_total
    - normalized_entropy
    - confidence
    - score_gap
    - rank_var_1
    - rank_var_5
    - rank_var_20
    - n_candidates

  topk_k: 80
  topk_temp: 0.1

  device: cuda:2
  batch_size: 64
  num_workers: 2
  bin_width: 0.1

model_groups:
  ensemble:
    out_subdir: ensemble
    models:
      bienc_mass:
        pred_dir: /data/home/mira/selective-msms/outputs/predictions/mass_mlp_bienc
        label: MLP Ensemble (Mass candidates, bienc)
        mode: ensemble
        ens_dir: /data/home/mira/data/msuq/logs/ensemble_20260709-1541_mass_bienc_T0003_retry
        ens_metric: reranker
        temperature: 0.003

