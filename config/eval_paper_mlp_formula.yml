# Reproduce the paper MLP/formula-candidate risk-coverage evaluation from
# precomputed Zenodo artifacts extracted into outputs/predictions/.

common:
  dataset_tsv: data/MassSpecGym.tsv
  helper_dir: data/
  gt_path: data/ground_truth_bits_labels_test.pt

  architecture: mlp
  candidate_setting: formula
  label_mode: fingerprint
  max_mz: 1005.0
  n_peaks: 128
  prec_mz_intensity: 1.1

  base_out_dir: outputs/paper_results/eval_v6

  metric: cosine
  top_k_hits: [1, 5, 20]
  temperature: 0.003
  aggregations: [score, fingerprint, probability]

  fingerprint_measures:
    - bitwise_epistemic
    - bitwise_aleatoric
    - bitwise_total
    - retrieval_aleatoric
    - retrieval_epistemic
    - retrieval_total

  retrieval_measures:
    - bitwise_total
    - bitwise_epistemic
    - retrieval_epistemic
    - retrieval_aleatoric
    - retrieval_total
    - normalized_entropy
    - confidence
    - score_gap
    - rank_var_1
    - rank_var_5
    - rank_var_20
    - n_candidates

  topk_k: 80
  topk_temp: 0.1

  device: cpu
  batch_size: 256
  num_workers: 2
  bin_width: 0.1

model_groups:
  ensemble:
    out_subdir: ensemble
    models:
      bienc:
        pred_dir: outputs/predictions/ensemble_ranking
        label: Deep Ensemble (Ranking)
        temperature: 0.003
        mode: ensemble

      focal:
        pred_dir: outputs/predictions/ensemble_focal
        label: Deep Ensemble (Focal)
        temperature: 0.003
        mode: ensemble

  mc_dropout:
    out_subdir: mc_dropout
    models:
      bienc:
        pred_dir: outputs/predictions/mcdo_ranking
        label: MC Dropout (Ranking)
        mode: mcdo
        passes: 50
        temperature: 0.003

      focal:
        pred_dir: outputs/predictions/mcdo_focal
        label: MC Dropout (Focal)
        mode: mcdo
        passes: 50
        temperature: 0.003

  laplace:
    out_subdir: laplace
    models:
      bienc:
        pred_dir: outputs/predictions/laplace_ranking
        label: Laplace (Ranking)
        mode: laplace
        laplace_samples: 50
        laplace_tune_prior: true
        laplace_max_batches: 200

      focal:
        pred_dir: outputs/predictions/laplace_focal
        label: Laplace (Focal)
        mode: laplace
        laplace_samples: 50
        laplace_tune_prior: true
        laplace_max_batches: 200
